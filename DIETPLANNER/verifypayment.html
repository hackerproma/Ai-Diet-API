<!DOCTYPE html>

<html>

<head>

    <title>Diet Planner Payment</title>

</head>

<body>

    <h2>Diet Planner</h2>

    <p>1 Month Subscription - ₹499</p>

    <button onclick="startPayment()">
        Pay ₹499
    </button>


    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>


    <script>

        async function startPayment() {

            const token = "7bcc3a5cad48c4fef371638e060b164fca1731b3";


            // Create order

            const response = await fetch(
                "http://127.0.0.1:8003/payment/create",
                {
                    method: "POST",

                    headers: {
                        "Authorization": "Token " + token,
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({})
                }
            );


            const data = await response.json();

            console.log(data);


            // Razorpay Checkout

            const options = {

                key: data.razorpay_key,

                amount: data.amount * 100,

                currency: data.currency,

                name: "Diet Planner",

                description: "1 Month Subscription",

                order_id: data.order_id,


                handler: async function(response) {

                    console.log(
                        "Payment ID:",
                        response.razorpay_payment_id
                    );

                    console.log(
                        "Order ID:",
                        response.razorpay_order_id
                    );

                    console.log(
                        "Signature:",
                        response.razorpay_signature
                    );


                    // Verify payment

                    const verifyResponse = await fetch(
                        "http://127.0.0.1:8000/payment/verify",
                        {
                            method: "POST",

                            headers: {

                                "Authorization":
                                    "Token " + token,

                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                razorpay_payment_id:
                                    response.razorpay_payment_id,

                                razorpay_order_id:
                                    response.razorpay_order_id,

                                razorpay_signature:
                                    response.razorpay_signature

                            })
                        }
                    );


                    const result =
                        await verifyResponse.json();


                    console.log(result);


                    alert(result.message);

                }

            };


            const razorpay =
                new Razorpay(options);


            razorpay.open();

        }

    </script>

</body>

</html>
